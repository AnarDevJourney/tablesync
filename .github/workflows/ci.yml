name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NestJS 12 needs Node 22.12+
        node: [22, 24]

    services:
      # for the tablesync-nest e2e tests
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tablesync
          POSTGRES_PASSWORD: tablesync
          POSTGRES_DB: tablesync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tablesync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TABLESYNC_TEST_DATABASE_URL: postgres://tablesync:tablesync@localhost:5432/tablesync_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
